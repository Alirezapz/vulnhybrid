name: graph research tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  graph-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU graph runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[research,graph,dev]'
      - name: Graph and leakage invariants
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest tests/test_graph_research.py tests/test_graph_fusion.py tests/test_graph_evaluation.py -q
